[build]
  # Run the build script
  base = "website"
  command = "bash build.sh"
  publish = "../dist"
  
[build.environment]
  # Python version
  PYTHON_VERSION = "3.11"
  # Node.js version; keep in sync with .node-version and package.json engines
  NODE_VERSION = "24"
  
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
