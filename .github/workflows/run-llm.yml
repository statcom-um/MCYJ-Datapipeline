name: Run LLM

on:
  workflow_run:
    workflows: ["Run Download Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      max_docs:
        description: 'Maximum number of documents to process per LLM step'
        required: false
        default: '100'
        type: number

permissions:
  contents: write

jobs:
  run-llm:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped publishing floating major tags at v8, so this
        # must be an exact version rather than @v10.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install Python dependencies
        run: uv sync

      - name: Run LLM analysis
        run: uv run python llm_analysis/run.py --max-count ${{ inputs.max_docs || 1000 }}
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: Commit and push LLM outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add llm_analysis/data/sir_summaries.csv \
                  llm_analysis/data/sir_violation_levels.csv \
                  llm_analysis/data/staffing_summaries.csv \
                  llm_analysis/data/keyword_labels.csv || true

          if git diff --cached --quiet; then
            echo "No LLM output changes to commit."
            exit 0
          fi

          git commit -m "Update SIR summaries, violation levels, staffing summaries, and keyword labels"
          git push origin "HEAD:${GITHUB_REF_NAME}"
