name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Pushes made by GITHUB_TOKEN (e.g. the LLM workflow committing its outputs)
  # do not fire the `push` trigger above, so chain off the run instead.
  workflow_run:
    workflows: ["Run LLM"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # workflow_run events carry the SHA from when the event fired, which
          # can predate the outputs the triggering run just pushed.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Resolve built commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        # setup-uv stopped publishing floating major tags at v8, so this
        # must be an exact version rather than @v10.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Install Python dependencies
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install Node.js dependencies
        run: |
          cd website
          npm ci

      - name: Generate website data
        run: |
          cd website
          uv run python generate_website_data.py \
            --document-csv ../ingestion/data/document_info.csv \
            --sir-summaries-csv ../llm_analysis/data/sir_summaries.csv \
            --sir-violation-levels-csv ../llm_analysis/data/sir_violation_levels.csv \
            --keyword-labels-csv ../llm_analysis/data/keyword_labels.csv \
            --facility-info-csv ../ingestion/data/facility_information.csv \
            --staffing-summaries-csv ../llm_analysis/data/staffing_summaries.csv \
            --gazetteer-zip ../public/2025_Gaz_zcta_national.zip \
            --output-dir public/data

      - name: Export parquet documents to JSON
        run: |
          cd website
          uv run python export_parquet_to_json.py \
            --parquet-dir ../ingestion/data/parquet_files \
            --output-dir public/documents \
            --document-csv ../ingestion/data/document_info.csv \
            --sir-summaries-csv ../llm_analysis/data/sir_summaries.csv \
            --sir-violation-levels-csv ../llm_analysis/data/sir_violation_levels.csv \
            --keyword-labels-csv ../llm_analysis/data/keyword_labels.csv \
            --staffing-summaries-csv ../llm_analysis/data/staffing_summaries.csv

      - name: Generate AI methodology data
        run: |
          cd website
          uv run python generate_ai_methodology.py

      - name: Build website
        run: |
          cd website
          npm run build
        env:
          VITE_BASE_URL: /MCYJ-Datapipeline/
          VITE_COMMIT_HASH: ${{ steps.commit.outputs.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
